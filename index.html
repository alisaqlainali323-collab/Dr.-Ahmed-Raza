/* ── PROFESSIONAL NAVBAR ─────────────────────────────────── */
.site-header{
  position:sticky;top:0;z-index:100;
  width:100%;
  background:rgba(255,255,255,.98);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid rgba(213,232,229,.8);
  box-shadow:0 1px 20px rgba(12,47,51,.06);
}
.site-header-inner{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:0;
  width:100%;
  max-width:none;
  /* Match hero left-col padding exactly: hero-v2-left uses padding-left:48px on ≥900px, 72px on ≥1100px */
  padding:0 72px;
  height:70px;
  box-sizing:border-box;
}
.brand{
  display:inline-flex;align-items:center;gap:10px;
  flex-shrink:0;text-decoration:none;
}
.brand-mark{
  display:grid;place-items:center;
  width:36px;height:36px;border-radius:10px;
  background:var(--primary);
  color:#fff;font-size:16px;font-weight:800;line-height:1;flex-shrink:0;
}
.brand strong{
  display:block;font-size:14.5px;font-weight:800;
  letter-spacing:.07em;text-transform:uppercase;color:#0f766e;
}
.brand small{
  display:block;margin-top:1px;color:var(--muted);
  font-size:9px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
}
/* Nav links — right side */
.site-nav{
  display:none;
  align-items:center;
  gap:2px;
  margin:0;padding:0;list-style:none;
  margin-left:auto;
}
.site-nav a{
  display:inline-block;
  padding:7px 16px;
  border-radius:7px;
  color:#3f5f63;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:500;
  transition:background .14s,color .14s;
  white-space:nowrap;position:relative;
}
.site-nav a:hover{
  background:rgba(15,118,110,.07);color:var(--primary);
}
.site-nav a.is-active{
  color:var(--primary);
}
.site-nav a.is-active::after{
  content:'';
  position:absolute;bottom:-2px;left:12px;right:12px;
  height:2px;border-radius:999px;
  background:var(--primary);
}
/* CTA button */
.nav-cta-wrap{
  display:none;
  align-items:center;gap:0;
  margin-left:5px;flex-shrink:0;
}
.nav-divider{
  width:1px;height:20px;background:var(--line);
  margin-right:20px;flex-shrink:0;
}
.header-cta{
  display:inline-flex;
  align-items:center;gap:1px;
  padding:9px 10px;
  border-radius:9px;
  background:var(--primary);
  color:#fff;font-family:'DM Sans',sans-serif;font-size:13.5px;font-weight:700;
  border:none;cursor:pointer;
  box-shadow:0 4px 14px rgba(15,118,110,.24);
  transition:background .15s,transform .14s,box-shadow .14s;
  text-decoration:none;white-space:nowrap;
}
.header-cta:hover{
  background:var(--primaryDark);transform:translateY(-1px);
  box-shadow:0 8px 22px rgba(15,118,110,.32);
}
.header-cta svg{
  width:14px;height:23px;stroke:#fff;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;
}
/* Mobile call button — icon-only circle, sits left of the hamburger */
.nav-call-mobile{
  display:none;
  align-items:center;justify-content:center;
  width:38px;height:38px;
  border-radius:8px;
  background:var(--primary);
  color:#fff;
  margin-left:auto;
  flex-shrink:0;
}
.nav-call-mobile .icon{ width:17px;height:17px; }
.nav-call-mobile .icon svg{ stroke:#fff; }
.nav-call-mobile:hover{ background:var(--primaryDark); }
/* Hamburger */
.nav-toggle{
  display:inline-grid;place-items:center;
  width:38px;height:38px;
  border:1px solid var(--line);border-radius:8px;
  color:var(--primary);background:var(--white);cursor:pointer;
  margin-left:10px;flex-shrink:0;
}
/* Desktop: show nav + CTA, hide mobile call + hamburger */
@media(min-width:980px){
  .site-nav{display:flex;}
  .nav-cta-wrap{display:flex;}
  .nav-call-mobile{display:none;}
  .nav-toggle{display:none;}
}
/* Tablet/mobile: hide desktop CTA pill, show icon call button + hamburger side by side */
@media(max-width:979px){
  .site-header-inner{padding:0 20px;height:60px;}
  .site-nav{
    display:none;
    position:absolute;top:60px;left:0;right:0;
    flex-direction:column;align-items:stretch;
    background:#fff;
    border-bottom:1px solid var(--line);
    box-shadow:0 8px 24px rgba(12,47,51,.09);
    padding:8px 16px 16px;z-index:99;margin-left:0;
  }
  .site-nav.is-open{display:flex;}
  .site-nav a{padding:12px 12px;border-radius:8px;font-size:15px;}
  .site-nav a.is-active::after{display:none;}
  .nav-cta-wrap{display:none;}
  .nav-call-mobile{display:inline-flex;margin-left:auto;}
  .nav-toggle{margin-left:8px;}
}
/* ── END NAVBAR ──────────────────────────────────────────── */

/* ── ABOUT SECTION MOBILE ─────────────────────────────────── */
/* On mobile: eyebrow + heading first, then image, then text + stats */
@media(max-width:979px){
  .section.about{
    display:flex !important;
    flex-direction:column !important;
    gap:0 !important;
  }
  /* Text column: split into header part and body part */
  .section.about .section-copy{
    display:contents; /* unwrap so children can be individually ordered */
  }
  .section.about .section-copy .eyebrow{ order:1; margin-bottom:8px; }
  .section.about .section-copy h2{      order:2; margin-bottom:0; }
  .section.about .about-media{          order:3; margin:20px 0; }
  .section.about .section-copy p{       order:4; }
  .section.about .section-copy .check-list{ order:5; }

  /* Stats panel: force 3-col horizontal row */
  .stats-panel{
    grid-template-columns:repeat(3,1fr) !important;
    gap:0 !important;
  }
  .stats-panel li{
    border-right:1px solid var(--line) !important;
    border-bottom:0 !important;
    padding-bottom:0 !important;
  }
  .stats-panel li:last-child{ border-right:0 !important; }
}
@media(max-width:480px){
  .stats-panel{ padding:10px 8px !important; }
  .stats-panel strong{ font-size:20px !important; }
  .stats-panel span:last-child{ font-size:11px !important; }
  .stats-panel li{ padding:0 4px !important; }
}
/* ── END ABOUT MOBILE ─────────────────────────────────────── */
/* All sections share the hero's horizontal padding */
.section{
  padding-left:72px !important;
  padding-right:72px !important;
  max-width:none;
  box-sizing:border-box;
}
@media(max-width:979px){
  .section{padding-left:20px !important;padding-right:20px !important;}
}

/* About image — fixed height, no overflow */
.about-image{
  display:block;
  width:100%;
  height:470px !important;
  min-height:unset !important;
  max-height:unset !important;
  object-fit:cover;
  border-radius:16px;
  overflow:hidden;
}
div.about-image{
  height:470px !important;
}
/* Stats panel — sits cleanly below image, no negative margin */
.stats-panel{
  position:static !important;
  margin:18px 0 0 !important;
  width:100% !important;
  border-radius:14px !important;
  border:1px solid var(--line) !important;
  box-shadow:0 8px 28px rgba(12,47,51,.08) !important;
}
@media(max-width:700px){
  .about-image,div.about-image{height:260px !important;}
  /* stats panel stays 3-col — overridden above in the about-mobile block */
}
/* ── END SECTION + ABOUT ALIGNMENT ──────────────────────── */

/* ── REDESIGNED HERO v3 — Mobile-First Gradient Fade ──────── */
@import url('https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@400;500;600;700&display=swap');

/* ════════════════════════════════════════════
   BASE HERO — shared across breakpoints
════════════════════════════════════════════ */
.hero-v2{
  position:relative;
  width:100%;
  overflow:hidden;
  display:flex;
  align-items:flex-end; /* content anchors to bottom on mobile */
}

/* Picture / image fills the entire hero */
.hero-v2 picture{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  z-index:0;
}
.hero-v2-bg{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;
  object-fit:cover;
  object-position:center top;
  display:block;
  z-index:0;
}

/* Placeholder when no image */
.hero-v2-placeholder{
  position:absolute;
  inset:0;
  z-index:0;
  background:linear-gradient(145deg,#0b3d3a 0%,#0f766e 45%,#2a9d8f 100%);
  display:flex;align-items:center;justify-content:center;
}
.hero-v2-placeholder-inner{
  display:flex;flex-direction:column;align-items:center;gap:16px;
  opacity:.35;color:#fff;
}
.hero-v2-placeholder-inner svg{ width:90px;height:90px;stroke:currentColor;fill:none;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round; }
.hero-v2-placeholder-inner span{ font-size:14px;font-weight:600;letter-spacing:.09em;text-transform:uppercase;color:#fff; }

/* Hide unused elements */
.hero-v2-right,.hero-v2-card,.hero-v2-badge,.hero-v2-blob1,.hero-v2-blob2,.hero-v2-curve,.hero-v2-img-overlay{ display:none; }

/* ════════════════════════════════════════════
   MOBILE HERO (≤768px) — Primary design
   Full-viewport, gradient fade from bottom
════════════════════════════════════════════ */
.hero-v2{
  min-height:90svh;
}

/* The gradient overlay — white at bottom fading to transparent at ~57% */
.hero-v2::after{
  content:'';
  position:absolute;
  inset:0;
  z-index:1;
  background:linear-gradient(
    to top,
    rgba(255,255,255,0.97) 0%,
    rgba(255,255,255,0.92) 30%,
    rgba(255,255,255,0.70) 50%,
    rgba(255,255,255,0.20) 75%,
    rgba(255,255,255,0)    95%
  );
  pointer-events:none;
}

/* Content — sits in bottom 40%, above gradient */
.hero-v2-left{
  position:relative;
  z-index:2;
  width:100%;
  max-width:100%;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  padding:0 24px 70px;
}

/* Eyebrow */
.hero-v2-eyebrow{
  display:flex;
  align-items:center;
  gap:12px;
  margin:0 0 16px;
  color:#0f766e;
}
.hero-v2-eyebrow-line{
  display:block;
  width:40px;
  height:1px;
  background:#0f766e;
  flex-shrink:0;
}
.hero-v2-eyebrow-text{
  font-family:'DM Sans',sans-serif;
  font-size:11px;
  font-weight:700;
  letter-spacing:0.14em;
  text-transform:uppercase;
  color:#0f766e;
  white-space:nowrap;
}

/* Headline */
.hero-v2-h1{
  font-family:'DM Serif Display',Georgia,serif;
  font-size:clamp(32px,8vw,55px);
  line-height:1.08;
  color:#0c2f33;
  margin:0 0 14px;
  font-weight:400;
}
.hero-v2-h1 em{
  font-style:italic;
  color:#0f766e;
}

/* Subtext */
.hero-v2-sub{
  font-family:Inter,Arial,sans-serif;
  font-size:16px;
  line-height:1.65;
  color:#3d4a5c;
  max-width:100%;
  margin:0 0 24px;
}

/* CTA row */
.hero-v2-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  align-items:center;
}

/* Primary CTA */
.hero-v2-btn-primary{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 10px;
  border-radius:10px;
  background:var(--primary,#0f766e);
  color:#fff;
  font-family:'DM Sans',sans-serif;
  font-size:12px;font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  border:none;cursor:pointer;
  box-shadow:0 6px 22px rgba(15,118,110,.30);
  transition:transform .18s ease,box-shadow .18s ease,background .18s;
  text-decoration:none;
  flex:1;
  justify-content:center;
  min-width:0;
}
.hero-v2-btn-primary:hover{
  background:var(--primaryDark,#0a4f4a);
  transform:translateY(-2px);
  box-shadow:0 12px 32px rgba(15,118,110,.38);
}
.hero-v2-btn-primary svg{
  width:15px;height:15px;stroke:#fff;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0;
}

/* Secondary CTA */
.hero-v2-btn-ghost{
  display:inline-flex;align-items:center;gap:8px;
  padding:14px 10px;
  border-radius:10px;
  background:rgba(166,139,75,.08);
  border:1.5px solid #0f766e;
  color:#0f766e;
  font-family:'DM Sans',sans-serif;
  font-size:12px;font-weight:700;
  letter-spacing:0.06em;
  text-transform:uppercase;
  cursor:pointer;
  transition:transform .18s ease;
  text-decoration:none;
  flex:0 0 auto;
  justify-content:center;
  white-space:nowrap;
}
.hero-v2-btn-ghost:hover{
  transform:translateY(-1px);
}
.hero-v2-btn-ghost svg{
  width:16px;height:16px;flex-shrink:0;
}

/* Buttons always sit side-by-side; primary grows, ghost stays content-width */

/* Fade-in animations */
/* .hero-v2-eyebrow animation removed — eyebrow element no longer rendered */
.hero-v2-h1     { animation:heroFadeUp .5s .13s both cubic-bezier(.22,.68,0,1.2); }
.hero-v2-sub    { animation:heroFadeUp .5s .20s both cubic-bezier(.22,.68,0,1.2); }
.hero-v2-actions{ animation:heroFadeUp .5s .27s both cubic-bezier(.22,.68,0,1.2); }
@keyframes heroFadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}

/* ════════════════════════════════════════════
   TABLET (769px–899px) — slightly wider padding
════════════════════════════════════════════ */
@media(min-width:769px) and (max-width:899px){
  .hero-v2-left{ padding:0 32px 48px; }
  .hero-v2-h1{ font-size:clamp(36px,6vw,48px); }
}

/* ════════════════════════════════════════════
   DESKTOP (≥1181px) — side-by-side layout
════════════════════════════════════════════ */
@media(min-width:1181px){
  .hero-v2{
    min-height:calc(100vh - 70px);
    align-items:center; /* vertically center on desktop */
  }
  /* On desktop, gradient covers left half so text is legible */
  .hero-v2::after{
    background:linear-gradient(
      to right,
      rgba(255,255,255,0.97) 0%,
      rgba(255,255,255,0.90) 20%,
      rgba(255,255,255,0.55) 35%,
      rgba(255,255,255,0)    55%
    );
  }
  .hero-v2-left{
    max-width:min(780px, 56%);
    padding:90px 48px 90px 72px;
    justify-content:center;
  }
  .hero-v2-sub{ max-width:500px; }
  .hero-v2-btn-primary,
  .hero-v2-btn-ghost{
    flex:0 0 auto;
    min-width:0;
  }
}
@media(min-width:1181px){
  .hero-v2-left{ padding:90px 56px 90px 72px; }
}

/* ── Tablet (769px–1180px) — dedicated tab image, content anchored bottom ── */
@media(min-width:769px) and (max-width:1180px){
  /* Tab image is purpose-built so no horizontal shifting needed */
  .hero-v2-bg{
    object-position:center top;
  }
  /* Content sits at the bottom like mobile — tall portrait viewport has room */
  .hero-v2{
    align-items:flex-end;
  }
  /* Gradient fades bottom-up like mobile, not left-right */
  .hero-v2::after{
    background:linear-gradient(
      to top,
      rgba(255,255,255,0.97) 0%,
      rgba(255,255,255,0.90) 22%,
      rgba(255,255,255,0.55) 45%,
      rgba(255,255,255,0.10) 60%,
      rgba(255,255,255,0)    75%
    );
  }
  /* Text sits full-width at the bottom with generous side padding */
  .hero-v2-left{
    max-width:700px;
    width:100%;
    padding:0 48px 230px;
  }
  .hero-v2-h1{
    font-size:clamp(36px,5vw,52px);
  }
  .hero-v2-sub{
    max-width:520px;
  }
}
/* ── Large tablets (900px–1180px): split layout — text left, photo right ──
   The portrait tab photo no longer gets stretched across a wide, short landscape box
   (which put the headline over the doctor's face) or a 1200px-tall portrait box. Hero height is
   capped, the photo sits in the right column and fades into the page on its left edge. */
@media(min-width:900px) and (max-width:1180px){
  .hero-v2{
    min-height:clamp(600px, calc(100svh - 70px), 780px);
    align-items:center;
    background:#fff;
  }
  .hero-v2::after{ display:none; }
  .hero-v2 picture{
    left:auto;
    right:0;
    width:56%;
    -webkit-mask-image:linear-gradient(to right, transparent 0, #000 34%);
            mask-image:linear-gradient(to right, transparent 0, #000 34%);
  }
  .hero-v2-bg{ object-position:center top; }
  .hero-v2-left{
    width:100%;
    max-width:56%;
    padding:72px 20px 110px 48px;
    justify-content:center;
  }
  .hero-v2-h1{ font-size:clamp(38px,4.7vw,52px); }
  .hero-v2-sub{ max-width:100%; }
  .hero-v2-btn-primary,
  .hero-v2-btn-ghost{ flex:0 0 auto; min-width:0; }
}
@media(min-width:901px) and (max-width:1099px){
  .value-card h3{line-height:1.25;min-height:2.5em;display:flex;align-items:center;justify-content:center;text-align:center}
}
/* ── END HERO v3 ─────────────────────────────────────────────── */
/* ── Booking wizard back button — smaller icon ── */
#wizBack2 .icon,
#wizBack3 .icon,
.wiz-actions .btn-ghost .icon,
.wiz-actions .btn-outline .icon{
  width:16px !important;
  height:16px !important;
}
.wiz-actions .btn-ghost .icon svg,
.wiz-actions .btn-outline .icon svg{
  width:16px !important;
  height:16px !important;
}

/* ── Hero ghost button — SVG uses warm beige tone ── */

/* ── SECTION SEPARATORS — bottom shadow ─────────────────── */
.section,
.section.compact,
.section.process,
.section.faq{
  box-shadow: 0 14px 40px -8px rgba(12,47,51,.07);
  position: relative;
  z-index: 1;
}
/* .process already gets a curved top+bottom edge (wave-edge SVGs) and
   .faq sits directly above the diagonal .book-cta band — the generic
   bottom shadow above shows through as a straight line against those
   curved/diagonal edges, so both are excluded here. */
.section.process,
.section.faq{
  box-shadow: none;
}
/* ── END SECTION SEPARATORS ─────────────────────────────── */

/* ── PREMIUM SECTION EDGES: curved + diagonal transitions ── */
.wave-edge{
  position:absolute;
  left:0;
  width:100%;
  height:56px;
  display:block;
  pointer-events:none;
  z-index:0;
}
.wave-edge.wave-top{ top:-1px; transform:scaleY(-1); }
.wave-edge.wave-bottom{ bottom:-1px; }
.process .section-heading,
.process .process-grid{ position:relative; z-index:1; }
.book-cta{
  clip-path:polygon(0 44px, 100% 0, 100% 100%, 0 100%);
}
@media (max-width:600px){
  .wave-edge{ height:36px; }
  .book-cta{ clip-path:polygon(0 26px, 100% 0, 100% 100%, 0 100%); }
}
/* ── END PREMIUM SECTION EDGES ────────────────────────────── */



/* ── SERVICES: sticky intro + ruled service list ─────────── */
.nb{white-space:nowrap}
.services-section{align-items:start}
.services-intro{max-width:460px}
.services-intro > p:not(.eyebrow){margin-bottom:0;color:var(--body-text)}
.services-cta{display:grid;justify-items:center;gap:16px;margin-top:-24px}
.services-cta .btn{min-width:240px}
.services-hours{display:flex;align-items:center;justify-content:center;gap:10px;margin:0;font-size:14.5px;font-weight:600;color:var(--ink)}
.services-hours .icon{width:18px;height:18px;color:var(--primary)}
/* Tablets (720–1279px): intro on top, two-column list below it, CTA underneath */
@media(min-width:720px) and (max-width:1279px){
  .services-intro{max-width:720px}
}
/* Side-by-side only from 1280px; below that the list columns were too narrow */
@media(min-width:1280px){
  /* intro + CTA stack in the left column; the list spans both rows on the right */
  .services-section{grid-template-columns:minmax(0,.62fr) minmax(0,1.38fr);grid-template-rows:auto 1fr;grid-template-areas:"intro list" "cta list";column-gap:72px;row-gap:0}
  .services-intro{grid-area:intro}
  .services-list{grid-area:list}
  .services-cta{grid-area:cta;justify-items:start;margin-top:32px}
  .services-cta .btn{min-width:0}
  .services-hours{justify-content:flex-start}
}
@media(max-width:520px){.services-cta .btn{width:100%}}
.services-list{list-style:none;margin:-26px 0 0;padding:0;display:grid;grid-template-columns:minmax(0,1fr);column-gap:44px}
.services-list li{border-bottom:1px solid var(--line)}
.services-list li:last-child{border-bottom:0}
@media(min-width:720px){
  .services-list{grid-template-columns:repeat(2,minmax(0,1fr))}
  /* with an even count the last row is the last two items; with an odd count the last item alone */
  .services-list li:nth-last-child(2):nth-child(odd){border-bottom:0}
}
.service-row{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:18px;align-items:start;padding:26px 6px;border-radius:14px;transition:background .18s ease}
.service-tile{display:grid;place-items:center;width:50px;height:50px;border-radius:15px;color:var(--primary);background:color-mix(in srgb,var(--primary) 8%,#fff);transition:background .18s ease,color .18s ease}
.service-tile .icon{width:25px;height:25px}
.service-head{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin-bottom:6px}
.service-head h3{margin:0;font-size:17px;font-weight:700;line-height:1.3}
.service-badge{padding:3px 10px;border-radius:999px;color:var(--primary);background:color-mix(in srgb,var(--primary) 10%,#fff);font-size:12px;font-weight:700;line-height:1.4}
.service-body p{margin:0;font-size:14.5px;line-height:1.65;color:var(--body-text)}
.service-go{display:grid;place-items:center;width:34px;height:34px;color:var(--accent);transition:color .18s ease,transform .18s ease}
.service-go .icon{width:20px;height:20px}
.service-row.is-featured .service-tile{color:#fff;background:var(--primary)}
.service-row:hover{background:color-mix(in srgb,var(--primary) 4%,#fff)}
.service-row:hover .service-tile{color:#fff;background:var(--primary)}
.service-row:hover .service-go{color:var(--primary);transform:translate(2px,-2px)}
.service-row:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
@media(prefers-reduced-motion:reduce){.service-row,.service-tile,.service-go{transition:none}.service-row:hover .service-go{transform:none}}
/* ── END SERVICES ─────────────────────────────────────────── */

/* ── PROCESS: step-number round badge ────────────────────── */
.step-number{
  display:inline-flex;align-items:center;margin-bottom:22px;
}
.step-number-badge{
  display:inline-flex;align-items:center;justify-content:center;

  box-shadow:0 4px 14px rgba(15,118,110,.28);
}
/* ── END PROCESS ──────────────────────────────────────────── */

/* ── FAQ: two-column layout desktop ──────────────────────── */
.faq{
  display:grid;
  grid-template-columns:1fr;
  gap:40px;
  max-width:none;
}
.faq-left-col{

}

}

}
.faq-left-image{

  }

  }

/* ══════════════════════════════════════════════════════════
   MODERN FAQ CARDS
══════════════════════════════════════════════════════════ */

  display:flex;
  align-items:center;
  justify-content:space-between;

}
.footer-legal a{
  color:rgba(255,255,255,.45);
  transition:color .15s;
}
.footer-legal a:hover{color:rgba(255,255,255,.9);}
/* ── END FOOTER ───────────────────────────────────────────── */

/* ══════════════════════════════════════════════════════════
   FAQ ROW — site-theme accordion, all closed by default
══════════════════════════════════════════════════════════ */
.faq-list{ display:flex; flex-direction:column; gap:0; }

/* Remove old faq-card styles that may conflict */
.faq-card, .faq-card__trigger, .faq-card__body,
.faq-card__q, .faq-card__icon, .faq-card__a { all:unset; }

/* Remove purple wrapper */
.faq-purple-wrap{ background:none; border-radius:0; overflow:visible; padding:0; }

.faq-row{
  border-bottom: 1px solid var(--line);
  background: transparent;
  overflow: hidden;
}
.faq-row:first-child{ border-top: 1px solid var(--line); }

.faq-row__trigger{
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 20px;
  width: 100%;
  padding: 20px 0;
  background: none;
  border: none;
  cursor: pointer;
  text-align: left;
}
.faq-row__q{
  font-size: 15.5px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.4;
  flex: 1;
  transition: color .18s;
}
.faq-row--open .faq-row__q{ color: var(--primary); }

.faq-row__chevron{
  flex-shrink: 0;
  width: 34px; height: 34px;
  display: flex; align-items: center; justify-content: center;
  border-radius: 999px;
  background: #0f766e;
  border: 1.5px solid var(--line);
  color: #ffffff;
  transition: background .2s, border-color .2s, color .2s;
}
.faq-row__chevron svg{
  width: 16px; height: 16px;
  stroke: currentColor;
  transition: transform .28s ease;
}
.faq-row--open .faq-row__chevron{
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.faq-row--open .faq-row__chevron svg{ transform: rotate(180deg); }

/* CRITICAL: body collapses by default via grid trick */
.faq-row__body{
  display: grid !important;
  grid-template-rows: 0fr !important;
  transition: grid-template-rows .28s ease;
}
.faq-row--open .faq-row__body{
  grid-template-rows: 1fr !important;
}
.faq-row__body > div{ overflow: hidden; }

.faq-row__a{
  padding: 0 0 20px;
  margin: 0;
  color: var(--muted);
  font-size: 15px;
  line-height: 1.75;
}
/* ── END FAQ ROW ─────────────────────────────────────────── */


/* ══════════════════════════════════════════════════════════
   3-STEP BOOKING WIZARD — redesigned to match reference
══════════════════════════════════════════════════════════ */

/* Hide old separate progress wrap — stepper is now inside the shell */
.wiz-progress-wrap{ display: none !important; }

/* Wizard shell — card style matching reference image */
.wiz-shell{
  max-width: 700px;
  margin: 0 auto 80px;
  padding: 32px 32px 36px;
  background: #fff;
  border: 1.5px solid var(--line);
  border-radius: 24px;
  box-shadow: 0 12px 40px rgba(12,47,51,.08);
}
@media(max-width:600px){
  .wiz-shell{ padding: 24px 20px 28px; margin-left: 16px; margin-right: 16px; }
}

/* ── Inline stepper inside shell ── */
.wiz-stepper-inline{
  display: flex;
  align-items: center;
  gap: 0;
  margin-bottom: 28px;
}
.wiz-stepper-inline__step{
  display: flex;
  align-items: center;
  gap: 8px;
  flex-shrink: 0;
}
.wiz-stepper-inline__dot{
  width: 32px; height: 32px;
  border-radius: 999px;
  background: #d9ece9;
  border: 2px solid #bfe0db;
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 800;
  color: var(--muted);
  transition: background .3s, border-color .3s, color .3s;
  flex-shrink: 0;
}
.wiz-stepper-inline__step--active .wiz-stepper-inline__dot{
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.wiz-stepper-inline__step--done .wiz-stepper-inline__dot{
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.wiz-stepper-inline__label{
  font-size: 13.5px; font-weight: 600;
  color: var(--muted);
  transition: color .3s;
  white-space: nowrap;
}
.wiz-stepper-inline__step--active .wiz-stepper-inline__label,
.wiz-stepper-inline__step--done .wiz-stepper-inline__label{
  color: var(--ink);
}
.wiz-stepper-inline__line{
  flex: 1;
  height: 2px;
  background: #d5e8e5;
  border-radius: 999px;
  margin: 0 10px;
  min-width: 24px;
}
.wiz-stepper-inline__line--done{
  background: var(--primary);
}
.wiz-pane{ animation: wizIn .28s ease; }
.wiz-pane--hidden{ display: none !important; }
@keyframes wizIn{
  from{ opacity:0; transform:translateY(12px); }
  to{   opacity:1; transform:translateY(0); }
}

/* Pane header */
.wiz-pane-head{ margin-bottom: 24px; }
.wiz-pane-num{
  display: none; /* step number now shown in inline stepper */
}
.wiz-pane-title{
  font-size: clamp(20px,4vw,28px);
  font-weight: 800;
  color: var(--ink);
  margin: 0 0 6px;
  font-family: 'DM Sans', sans-serif;
}
.wiz-pane-sub{
  color: var(--muted);
  font-size: 14.5px;
  margin: 0;
}

/* Service / Reason chip grid — 3 columns pill style (matches reference image) */
.svc-grid{
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
  margin-bottom: 28px;
}
@media(max-width:480px){
  .svc-grid{ grid-template-columns: repeat(2, 1fr); }
}
.svc-card{
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px 10px;
  border: 1.5px solid var(--line);
  border-radius: 16px;
  background: #fafbfc;
  cursor: pointer;
  transition: border-color .18s, box-shadow .18s, background .18s;
  text-align: center;
  min-height: 56px;
}
.svc-card:hover{
  border-color: rgba(15,118,110,.3);
  box-shadow: 0 4px 16px rgba(15,118,110,.07);
  background: #f3faf9;
}
.svc-card input{ position:absolute; opacity:0; pointer-events:none; }
.svc-card__radio{ display: none; }
.svc-card__label{
  font-size: 14.5px;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.3;
}
.svc-card__check{ display:none; }
.svc-card:has(input:checked){
  border-color: var(--primary);
  background: rgba(15,118,110,.06);
  box-shadow: 0 4px 18px rgba(15,118,110,.13);
}
.svc-card:has(input:checked) .svc-card__label{
  color: var(--primary);
  font-weight: 700;
}

/* Date & time step */
.dt-grid{
  display: grid;
  grid-template-columns: 1fr;
  gap: 28px;
  margin-bottom: 36px;
}
@media(min-width:600px){ .dt-grid{ grid-template-columns: 1fr 1.4fr; } }
.dt-label{
  font-size: 13px;
  font-weight: 800;
  letter-spacing: .06em;
  text-transform: uppercase;
  color: var(--muted);
  margin: 0 0 14px;
}
.dt-date-input{
  width: 100%;
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 16px 18px;
  font-size: 15px;
  color: var(--ink);
  background: #fff;
  outline: none;
  transition: border-color .18s, box-shadow .18s;
}
.dt-date-input:focus{
  border-color: var(--primary);
  box-shadow: 0 0 0 4px rgba(15,118,110,.10);
}
.time-pill-grid{
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 10px;
}
.time-pill{
  position: relative;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 11px 6px;
  border: 1.5px solid var(--line);
  border-radius: 10px;
  background: #fff;
  cursor: pointer;
  font-size: 13px;
  font-weight: 700;
  color: var(--ink);
  transition: border-color .18s, background .18s, color .18s;
}
.time-pill input{ position:absolute; opacity:0; pointer-events:none; }
.time-pill:hover{ border-color: rgba(15,118,110,.35); }
.time-pill:has(input:checked){
  background: #0f766e9c;
  border-color: var(--primary);
  color: #fff;
  box-shadow: 0 4px 14px rgba(15,118,110,.22);
}

/* Patient details step */
.wiz-form-grid{
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 18px;
  margin-bottom: 24px;
}
@media(max-width:540px){ .wiz-form-grid{ grid-template-columns: 1fr; } }
.wiz-label-field{
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 13px;
  font-weight: 700;
  color: #2f4a4d;
  letter-spacing: .03em;
}
.wiz-label-field .field-label{
  display: flex;
  align-items: center;
  gap: 5px;
  line-height: 1;
}
.wiz-label-field input,
.wiz-label-field textarea{
  border: 1.5px solid var(--line);
  border-radius: 12px;
  padding: 13px 14px 13px 42px;
  font-size: 15px;
  font-weight: 400;
  color: var(--ink);
  background: #f8fafc;
  outline: none;
  transition: border-color .18s, box-shadow .18s, background .18s;
  width: 100%;
  font-family: inherit;
}
.wiz-label-field textarea{ resize:vertical; padding-left: 42px; }
.wiz-label-field input:focus,
.wiz-label-field textarea:focus{
  border-color: var(--primary);
  background: #fff;
  box-shadow: 0 0 0 4px rgba(15,118,110,.10);
}
.wiz-full{ grid-column: 1 / -1; }
.req{ color: var(--primary); }
.opt{ font-weight:400; color:var(--muted); font-size:11px; }

/* Booking summary */
.wiz-summary{
  background: var(--surface);
  border: 1.5px solid var(--line);
  border-radius: 14px;
  padding: 20px 22px;
  margin-bottom: 28px;
  display: none;
  gap: 10px;
  flex-direction: column;
}
.wiz-summary.is-visible{ display:flex; }
.wiz-summary-row{
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 14px;
  color: var(--ink);
}
.wiz-summary-row strong{ font-weight:700; min-width:80px; color:var(--muted); }

/* Actions row — Back left, Continue right, side by side */
.wiz-actions{
  display: flex;
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding-top: 16px;
}
.wiz-actions .btn-primary{
  flex: 1;
  justify-content: center;
  border-radius: 12px;
  padding: 15px 24px;
  font-size: 15px;
  background: var(--primary);
  box-shadow: 0 6px 20px rgba(15,118,110,.22);
  letter-spacing: .02em;
  color: #fff;
  border: none;
  transition: box-shadow .18s ease;
}
.wiz-actions .btn-primary:hover{
  background: var(--primary);
  transform: none;
  box-shadow: 0 8px 28px rgba(15,118,110,.32);
}
.wiz-actions .btn-outline{
  flex: 0 0 auto;
  background: #fff;
  border: 1.5px solid var(--line);
  color: var(--muted);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  padding: 15px 20px;
  min-height: 52px;
  box-shadow: none;
  transition: border-color .18s, color .18s;
}
.wiz-actions .btn-outline:hover{
  border-color: #9cc4be;
  color: var(--ink);
  transform: none;
  box-shadow: none;
}
.wiz-actions .btn-ghost{
  flex: 0 0 auto;
  background: none;
  border: none;
  color: var(--muted);
  font-size: 14px;
  font-weight: 600;
  padding: 0;
  min-height: auto;
  box-shadow: none;
}
.wiz-actions .btn-ghost:hover{
  color: var(--ink);
  transform: none;
}
/* Step 1: Back Home ghost on left, Continue on right — same side-by-side as other steps */
#wizPane1 .wiz-actions{
  flex-direction: row;
  align-items: center;
  justify-content: space-between;
}
#wizPane1 .wiz-actions .btn-primary{
  order: 2;
  flex: 1;
}
#wizPane1 .wiz-actions .btn-ghost{
  order: 1;
  flex: 0 0 auto;
  background: #fff;
  border: 1.5px solid var(--line);
  color: var(--muted);
  border-radius: 12px;
  font-size: 14px;
  font-weight: 700;
  padding: 15px 20px;
  min-height: 52px;
  box-shadow: none;
  transition: border-color .18s, color .18s;
}
#wizPane1 .wiz-actions .btn-ghost:hover{
  border-color: #9cc4be;
  color: var(--ink);
  transform: none;
  box-shadow: none;
}

/* Success screen */
.wiz-success{
  text-align: center;
  padding: 64px 24px;
}
.wiz-success-icon{
  width: 72px; height: 72px;
  border-radius: 999px;
  background: rgba(15,118,110,.1);
  color: var(--primary);
  display: flex; align-items:center; justify-content:center;
  margin: 0 auto 28px;
}
.wiz-success-icon svg{ width:36px;height:36px; }
.wiz-success h2{ font-size:32px; margin-bottom:14px; }
.wiz-success p{ color:var(--muted); font-size:16px; max-width:460px; margin:0 auto 36px; }
/* ── Wizard buttons: always side-by-side, override global mobile .btn{width:100%} ── */
@media(max-width:520px){
  .wiz-actions .btn{ width: auto !important; min-width: 0; }
  .wiz-actions .btn-primary{ flex: 1 !important; }
  .wiz-actions .btn-outline{ flex: 0 0 auto !important; }
  .wiz-actions .btn-ghost{ flex: 0 0 auto !important; }
}

/* ── CONTACT FULL-WIDTH MAP ──────────────────────────────── */
.contact-section{
  display:block !important;
  padding:80px 72px !important;
}
@media(max-width:979px){
  .contact-section{padding:60px 20px !important;}
}
.contact-head{max-width:680px;margin:0 auto 48px;text-align:center}
.contact-head .eyebrow{margin-bottom:16px}
.contact-head > p:last-child{margin-bottom:0}
.contact-top-grid{
  display:grid;
  grid-template-columns:1fr;
  gap:24px;
  margin-bottom:48px;
  align-items:stretch;
}
@media(min-width:980px){
  .contact-top-grid{
    grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);
    gap:32px;
  }
}
.contact-map-full{
  width:100%;
  min-height:550px;
}
.contact-map-full .map-placeholder{
  min-height:320px;
  border-radius:14px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
}
@media(min-width:980px){
  .contact-map-placeholder{
    min-height:560px !important;
  }
}

/* ── BOOKING PAGE SMALL SCREEN FIXES ─────────────────────── */
@media(max-width:420px){
  .booking-hero{
    padding-left:16px !important;
    padding-right:16px !important;
  }
  .wiz-shell{
    margin-left:12px;

    padding:20px 16px 24px;
    border-radius:18px;
  }
  .svc-grid{
    grid-template-columns:1fr 1fr !important;

  }
  .wiz-form-grid{

  .wiz-pane-title{

  }
}
/* ── END BOOKING SMALL SCREEN ─────────────────────────────── */

  gap: 8px;

}

}

.date-btn-row{

.date-btn{

  z-index:-1;
  background:
    radial-gradient(circle at 6% 4%, rgba(20,184,166,.10), transparent 38%),
    radial-gradient(circle at 96% 8%, rgba(15,118,110,.09), transparent 36%),
    radial-gradient(circle at 50% 108%, rgba(20,184,166,.07), transparent 42%);
}

/* — header (plain, no background behind the text) — */
.gallery-hero{
  max-width:680px;
  margin:0 auto 40px;
  padding:0 20px;
  text-align:center;
}
.gallery-eyebrow{ text-align:center; }
.gallery-title{
  margin-bottom:14px;
  font-size:clamp(30px,4.5vw,42px);
}
.gallery-subtitle{
  max-width:52ch;
  margin:0 auto;
  font-size:16px;
  line-height:1.7;
}

/* — filter pills — */
.gallery-filters{
  display:flex;
  flex-wrap:wrap;
  justify-content:center;
  gap:10px;
  margin:0 0 40px;
}
.gallery-filter-btn{
  padding:10px 20px;
  border-radius:999px;
  border:1.5px solid var(--line);
  background:#fff;
  color:#4a5f62;
  font-size:13.5px;
  font-weight:700;
  cursor:pointer;
  transition:background .16s,border-color .16s,color .16s,transform .16s;
}
.gallery-filter-btn:hover{ border-color:#9cc4be; color:var(--ink); }
.gallery-filter-btn.is-active{
  background:var(--primary);
  border-color:var(--primary);
  color:#fff;
  box-shadow:0 8px 20px rgba(15,118,110,.24);
}

/* — bento grid: mixed tile sizes, uniform row height, rows always complete — */
.gallery-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  grid-auto-rows:300px;
  gap:16px;
  margin-bottom:48px;
}
.gallery-item{
  position:relative;
  grid-column:span 1;
  margin:0;
  border-radius:20px;
  overflow:hidden;
  background:var(--surface);
  box-shadow:var(--shadow-sm);
}
.gallery-item--wide{ grid-column:span 2; }
.gallery-item .image-fill,
.gallery-item .image-placeholder{
  width:100%;
  height:100%;
  min-height:0;
  border-radius:0;
  transition:transform .35s ease;
}
.gallery-item:hover .image-fill{ transform:scale(1.05); }
.gallery-item figcaption{
  position:absolute;
  inset:auto 0 0 0;
  padding:28px 16px 14px;
  background:linear-gradient(0deg,rgba(12,47,51,.72) 0%,transparent 100%);
  color:#fff;
  font-size:13.5px;
  font-weight:700;
  opacity:0;
  transform:translateY(6px);
  transition:opacity .2s ease,transform .2s ease;
}
.gallery-item:hover figcaption{ opacity:1; transform:translateY(0); }
@media (min-width:720px){
  .gallery-grid{ grid-template-columns:repeat(4,1fr); grid-auto-rows:260px; }
}

/* — trust strip — */
.gallery-trust-strip{
  display:grid;
  gap:28px;
  padding:32px 28px;
  border:1.5px solid var(--line);
  border-radius:20px;
  background:#fff;
  box-shadow:0 8px 32px rgba(12,47,51,.05);
}
.gallery-trust-item{
  display:flex;
  gap:16px;
  align-items:flex-start;
}
.gallery-trust-icon{
  flex:0 0 auto;
  display:grid;
  place-items:center;
  width:46px;
  height:46px;
  border-radius:999px;
  background:var(--surface);
  color:var(--primary);
}
.gallery-trust-icon svg{ width:22px; height:22px; }
.gallery-trust-item h3{ margin-bottom:4px; font-size:15.5px; }
.gallery-trust-item p{ margin:0; font-size:13.5px; line-height:1.55; }
@media (min-width:720px){
  .gallery-trust-strip{ grid-template-columns:repeat(3,1fr); }
}

.lightbox{
  position:fixed;inset:0;z-index:200;
  display:none;
  align-items:center;justify-content:center;
  padding:32px;
  background:rgba(12,47,51,.86);
}
.lightbox.is-open{display:flex;}
.lightbox-inner{ text-align:center; }
.lightbox img{
  max-width:min(900px,100%);
  max-height:80vh;
  border-radius:12px;
  box-shadow:0 24px 60px rgba(0,0,0,.4);
}
.lightbox-caption{
  margin:16px 0 0;
  color:#fff;
  font-size:14px;
  font-weight:600;
}
.lightbox-close{
  position:absolute;top:24px;right:24px;
  display:grid;place-items:center;
  width:44px;height:44px;
  border-radius:999px;
  border:1px solid rgba(255,255,255,.3);
  background:rgba(255,255,255,.1);
  color:#fff;
  cursor:pointer;
}
/* ── END MODERN PHOTO GALLERY ────────────────────────────── */


/* ── MODERN ABOUT PAGE ────────────────────────────────────── */
:root{ --seal:#b8863b; }

/* — hero intro — */
.dr-about-hero{
  position:relative;
  padding:72px 0 128px;
  background:var(--surface);
  overflow:visible;
}
.dr-about-hero-inner{
  position:relative;
  width:min(var(--container),calc(100% - 40px));
  margin:0 auto;
}
.dr-about-hero-grid{
  display:grid;
  grid-template-columns:1fr;
  grid-template-areas:
    "heading"
    "portrait"
    "body";
  row-gap:24px;
  padding-bottom:72px;
}
.dr-about-hero-heading{ grid-area:heading; animation:drFadeUp .7s ease both; }
.dr-about-hero-body{ grid-area:body; animation:drFadeUp .7s ease both; }
.dr-about-lead-text{ max-width:58ch; }

/* — credential line under the name — */
.dr-credential-line{
  margin:-25px 0 0;
  color:var(--primary);
  font-size:15.5px;
  font-weight:700;
  letter-spacing:.01em;
}

/* — credentials checklist (replaces old benefit-card feature row) — */
.dr-credentials-label{
  margin:28px 0 14px;
  color:var(--muted);
  font-size:12px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.dr-credentials-list{ margin-bottom:32px; }

/* — placeholder marker for facts not supplied yet (med school, PMDC #) — */
.fill-me{
  display:inline-block;
  padding:1px 7px;
  border:1px dashed var(--seal);
  border-radius:5px;
  background:rgba(184,134,59,.12);
  color:var(--seal);
  font-weight:700;
  font-size:.94em;
  white-space:nowrap;
}

/* — portrait with verified seal — */
.dr-portrait{
  grid-area:portrait;
  position:relative;
  animation:drFadeUp .7s ease .1s both;
}
.dr-portrait::before{
  content:"";
  position:absolute;
  inset:16px -16px -16px 16px;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:26px;
  z-index:0;
}
.dr-portrait-frame{
  position:relative;
  z-index:1;
  aspect-ratio:4/5;
  border-radius:26px 26px 26px 6px;
  overflow:hidden;
  box-shadow:var(--shadow-lg);
}
.dr-portrait-frame .image-fill,
.dr-portrait-frame .image-placeholder{
  width:100%;
  height:100%;
  min-height:0;
}
.dr-seal{
  position:absolute;
  right:-16px;
  bottom:-16px;
  z-index:2;
  filter:drop-shadow(0 10px 24px rgba(12,47,51,.2));
}

/* — floating stat bar — */
.dr-stat-bar{
  position:relative;
  z-index:2;
  margin:-40px 0 0;
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:0;
  padding:26px 16px;
  list-style:none;
  background:var(--white);
  border:1px solid var(--line);
  border-radius:20px;
  box-shadow:var(--shadow-lg);
  animation:drFadeUp .7s ease .2s both;
}
.dr-stat-bar li{
  display:grid;
  justify-items:center;
  gap:6px;
  padding:14px 10px;
  text-align:center;
  border-right:1px solid var(--line);
}
.dr-stat-bar li:nth-child(2n),
.dr-stat-bar li:last-child{ border-right:0; }
.dr-stat-bar li:nth-child(3) .dr-stat-icon,
.dr-stat-bar li:nth-child(3) strong{ color:#0c2f33; }
.dr-stat-icon{ color:var(--primary); }
.dr-stat-bar strong{
  font-family:'DM Serif Display',Georgia,serif;
  font-size:clamp(22px,4vw,28px);
  font-weight:400;
  color:var(--ink);
  line-height:1;
}
.dr-stat-bar span:last-child{
  font-size:11.5px;
  font-weight:700;
  letter-spacing:.04em;
  text-transform:uppercase;
  color:var(--muted);
}

/* — approach / values section — */
.dr-approach{ padding:100px 0 96px; }
.dr-approach-inner{
  width:min(var(--container),calc(100% - 40px));
  margin:0 auto;
  display:grid;
  gap:32px;
}
.dr-approach-media{
  position:relative;
  border-radius:24px 24px 24px 6px;
  overflow:hidden;
  box-shadow:var(--shadow-lg);
  aspect-ratio:4/3;
}
.dr-approach-media .image-fill,
.dr-approach-media .image-placeholder{
  width:100%;
  height:100%;
  min-height:0;
}
.dr-philosophy{
  margin:18px 0 32px;
  padding-left:20px;
  border-left:3px solid var(--seal);
  font-family:'DM Serif Display',Georgia,serif;
  font-style:italic;
  font-size:clamp(19px,2.2vw,23px);
  line-height:1.5;
  color:var(--ink);
}
.dr-values-grid{ display:grid; gap:28px; }
.dr-value-icon{
  display:grid;
  place-items:center;
  width:40px;
  height:40px;
  margin-bottom:12px;
  border-radius:999px;
  background:var(--surface);
  color:var(--primary);
}
.dr-value h3{ margin-bottom:6px; font-size:16px; }
.dr-value p{ margin:0; font-size:13.5px; line-height:1.55; }

@keyframes drFadeUp{
  from{ opacity:0; transform:translateY(14px); }
  to{ opacity:1; transform:translateY(0); }
}
@media (prefers-reduced-motion:reduce){
  .dr-about-hero-heading,.dr-about-hero-body,.dr-portrait,.dr-stat-bar{ animation:none; }
}
@media (max-width:640px){
  .dr-portrait::before{ inset:12px -8px -8px 12px; }
  .dr-seal{ right:8px; bottom:8px; }
  .dr-seal svg{ width:60px; height:60px; }
  .dr-about-hero{ padding-bottom:96px; }
  .dr-stat-bar{ margin-top:-40px; }
}
@media (min-width:640px){
  .dr-values-grid{ grid-template-columns:repeat(2,1fr); }
}
@media (min-width:720px){
  .dr-stat-bar{ grid-template-columns:repeat(4,1fr); }
  .dr-stat-bar li:nth-child(2n){ border-right:1px solid var(--line); }
  .dr-stat-bar li:last-child{ border-right:0; }
}
@media (min-width:980px){
  .dr-about-hero-grid{
    grid-template-columns:minmax(0,1fr) minmax(0,.86fr);
    grid-template-areas:
      "heading portrait"
      "body    portrait";
    align-items:center;
    column-gap:44px;
    row-gap:14px;
  }
  .dr-approach-inner{
    grid-template-columns:minmax(0,.86fr) minmax(0,1.14fr);
    grid-template-areas:
      "media text"
      "media values";
    row-gap:32px;
    column-gap:48px;
  }
  .dr-approach-text{ grid-area:text; align-self:end; }
  .dr-approach-media{ grid-area:media; aspect-ratio:auto; min-height:460px; }
  .dr-approach-values{ grid-area:values; }
}
/* ── END MODERN ABOUT PAGE ───────────────────────────────── */

/* ── FINAL BOOKING CTA BAND ──────────────────────────────── */
.book-cta{
  position:relative;
  overflow:hidden;
  padding:88px 20px;
  background:linear-gradient(135deg,var(--primary) 0%,var(--primaryDark) 100%);
  text-align:center;
}
.book-cta::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 15% 20%,rgba(255,255,255,.08),transparent 40%),
             radial-gradient(circle at 85% 80%,rgba(255,255,255,.06),transparent 45%);
  pointer-events:none;
}
.book-cta-inner{
  position:relative;
  max-width:640px;
  margin:0 auto;
}
.book-cta-eyebrow{
  margin:0 0 16px;
  color:#bfe6e0;
  font-size:13px;
  font-weight:800;
  letter-spacing:.08em;
  text-transform:uppercase;
}
.book-cta-title{
  margin:0 0 18px;
  color:#fff;
  font-family:'DM Serif Display',Georgia,serif;
  font-weight:400;
  line-height:1.12;
  font-size:clamp(30px,4.5vw,44px);
}
.book-cta-text{
  margin:0 auto 36px;
  max-width:52ch;
  color:rgba(255,255,255,.82);
  font-size:16px;
  line-height:1.7;
}
.book-cta-actions{
  display:flex;
  flex-wrap:wrap;
  gap:16px;
  justify-content:center;
}
.book-cta-btn-primary{
  color:var(--primaryDark);
  background:#fff;
  box-shadow:0 14px 30px rgba(0,0,0,.18);
}
.book-cta-btn-primary:hover{ background:#e8f6f4; }
.book-cta-btn-ghost{
  color:#fff;
  background:transparent;
  border-color:rgba(255,255,255,.45);
}
.book-cta-btn-ghost:hover{ background:rgba(255,255,255,.1); }
@media (max-width:520px){
  .book-cta-actions{ flex-direction:column; align-items:stretch; }
}
/* ── END FINAL BOOKING CTA BAND ──────────────────────────── */

/* ── CONTACT PAGE REFRESH ────────────────────────────────── */
.contact-info-card{
  display:flex;
  flex-direction:column;
  margin-top:0;
  padding:32px;
  background:#fff;
  border:1.5px solid var(--line);
  border-radius:20px;
  box-shadow:0 8px 32px rgba(12,47,51,.05);
}
.contact-card-head{margin-bottom:24px;padding-bottom:22px;border-bottom:1px solid var(--line)}
.contact-card-head h3{margin:0 0 6px;font-family:'DM Serif Display',Georgia,serif;font-size:28px;font-weight:400;line-height:1.15}
.contact-card-head p{margin:0;font-size:14.5px;line-height:1.6}
.contact-list{ margin:0 0 26px; }
.contact-list .icon{
  display:grid;
  place-items:center;
  width:38px;
  height:38px;
  border-radius:999px;
  background:var(--surface);
  color:var(--primary);
}
.contact-list .icon svg{ width:18px; height:18px; }
.contact-info-actions{
  display:flex;
  flex-wrap:wrap;
  gap:12px;
  margin-top:auto;
}
.contact-info-actions .btn{ flex:1 1 180px; }
.contact-whatsapp-btn{
  color:#fff;
  background:#25D366;
  box-shadow:0 10px 26px rgba(37,211,102,.28);
}
.contact-whatsapp-btn:hover{ background:#1ebe57; }
@media (max-width:520px){
  /* column layout: reset flex-basis so 180px doesn't become each button's HEIGHT */
  .contact-info-actions{ flex-direction:column; }
  .contact-info-actions .btn{ flex:0 0 auto; width:100%; }
  .contact-info-card{ padding:24px; }
}

/* form error state (real send failed / not configured yet) */
.cfm-error-msg{
  display:none;
  align-items:flex-start;
  gap:10px;
  padding:14px 18px;
  border-radius:12px;
  background:rgba(220,38,38,.06);
  border:1.5px solid rgba(220,38,38,.24);
  color:#991b1b;
  font-size:14px;
  font-weight:600;
  line-height:1.55;
}
.cfm-error-msg svg{ stroke:#dc2626; flex-shrink:0; margin-top:2px; }
.cfm-error-msg a{ color:#991b1b; text-decoration:underline; font-weight:800; }
.contact-form-modern.is-error .cfm-error-msg{ display:flex; }
.cfm-submit:disabled{ opacity:.7; cursor:not-allowed; transform:none; }
/* ── END CONTACT PAGE REFRESH ────────────────────────────── */

.values-decor{
  position:absolute;
  top:-100px;
  left:-140px;
  width:440px;
  height:440px;
  border-radius:50%;
  background:radial-gradient(circle,rgba(255,255,255,.10),transparent 70%);
  pointer-events:none;
}
.values-inner{
  position:relative;
  z-index:1;
  width:min(var(--container),calc(100% - 40px));
  margin:0 auto;
}
.values-heading{
  max-width:640px;
  margin:0 auto 52px;
  text-align:center;
}
.values-eyebrow{ text-align:center; color:#fff; }
.values-divider-row{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:14px;
  margin:14px 0 18px;
}
.values-divider-line{
  width:64px;
  height:1.5px;
  background:linear-gradient(90deg,transparent,#fff);
}
.values-divider-row .values-divider-line:last-child{
  background:linear-gradient(90deg,#fff,transparent);
}
.values-divider-icon{
  display:grid;
  place-items:center;
  width:20px;
  height:20px;
  color:#fff;
}
.values-divider-icon .icon{ width:18px; height:18px; }
.values-divider-icon .icon svg{ fill:currentColor; stroke:none; }
.values-title{ margin-bottom:14px; color:#fff; }
.values-title span{ color:#fff; }
.values-subtitle{ font-size:16px; line-height:1.7; color:rgba(255,255,255,.82); }

.values-grid{
  display:grid;
  gap:24px;
}
.value-card{
  position:relative;
  padding:36px 26px 30px;
  background:#fff;
  border-radius:20px;
  border-bottom:4px solid var(--primary);
  box-shadow:0 14px 40px rgba(12,47,51,.07);
  text-align:center;
}
.value-icon{
  display:grid;
  place-items:center;
  width:80px;
  height:80px;
  margin:0 auto 20px;
  border-radius:50%;
  background:var(--surface);
  color:var(--primary);
}
.value-icon .icon{ width:32px; height:32px; }
.value-card h3{ margin-bottom:14px; font-size:19px; }
.value-divider{
  position:relative;
  height:1.5px;
  margin-bottom:22px;
  background:var(--line);
}
.value-divider::after{
  content:"";
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--primary);
}

.review-marquee{
  overflow:hidden;
  width:100%;
  -webkit-mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
  mask-image:linear-gradient(90deg,transparent,#000 6%,#000 94%,transparent);
}
.review-track{
  display:flex;
  gap:20px;
  width:max-content;
  animation:reviewScroll 46s linear infinite;
}
.review-marquee:hover .review-track{ animation-play-state:paused; }
.review-track .review-card{
  flex:0 0 auto;
  width:320px;
}
.review-card strong{ margin-top:20px; }
@keyframes reviewScroll{
  from{ transform:translateX(0); }
  to{ transform:translateX(-50%); }
}

  .review-track .review-card{ width:min(82vw,300px); }
}

/* ── POLISH PASS: type, labels, process timeline ──────────── */
:root{--body-text:color-mix(in srgb,var(--ink) 74%,#fff)}
h1,h2,h3{text-wrap:balance}
p{text-wrap:pretty}
/* Section labels: sentence-case, quieter than tracked all-caps (color left to each section) */
.eyebrow{font-size:14.5px;font-weight:600;letter-spacing:.01em;text-transform:none}
.process p:not(.eyebrow){color:var(--body-text)}
/* Process: connected timeline on tablet/desktop instead of four boxed cards */
@media(min-width:720px){
  .process-grid{justify-items:stretch;align-items:start;gap:32px;max-width:none;margin:0}
  .process-grid .step-card{background:transparent;border:0;box-shadow:none;border-radius:0;padding:0 4px;text-align:center}
  .process-grid .step-number{display:flex;justify-content:center}
  .process-grid .step-card:not(:last-child) .step-number::after{content:"";position:absolute;left:calc(50% + 28px);width:calc(100% - 24px);top:19px;height:2px;border-radius:2px;background:color-mix(in srgb,var(--primary) 28%,#fff)}
  .process-grid .step-card h3{font-size:18px}
  .process-grid .step-card p{max-width:30ch;margin-left:auto;margin-right:auto}
}
/* ── END POLISH PASS ──────────────────────────────────────── */

/* ── SCROLL REVEAL ────────────────────────────────────────── */
/* Classes are added by JS only when motion is allowed, and removed again once an element has
   finished animating, so nothing here affects hover states or layout afterwards. */
html.rv-ready .rv{will-change:opacity,transform}
html.rv-ready .rv:not(.rv-in){opacity:0;transition:none}
html.rv-ready .rv-up:not(.rv-in){transform:translateY(30px)}
html.rv-ready .rv-scale:not(.rv-in){transform:translateY(24px) scale(.965)}
html.rv-ready .rv-fade:not(.rv-in){transform:none}
/* The transition lives on the revealed state only, so hiding at load is instant (no fade-out flash) */
html.rv-ready .rv.rv-in{
  opacity:1;transform:none;
  transition:opacity .8s cubic-bezier(.22,.61,.36,1),transform .8s cubic-bezier(.22,.61,.36,1);
}
/* Process: step badges pop in and the connector lines draw left to right */
html.rv-ready .step-card.rv:not(.rv-in) .step-number-badge{transform:scale(.6)}
html.rv-ready .step-card.rv-in .step-number-badge{transition:transform .6s cubic-bezier(.34,1.56,.64,1) .2s}
html.rv-ready .process-grid .step-card:not(:last-child) .step-number::after{transform-origin:left center}
html.rv-ready .process-grid:not(.is-drawn) .step-card .step-number::after{transform:scaleX(0)}
html.rv-ready .process-grid.is-drawn .step-card:not(:last-child) .step-number::after{transition:transform .9s cubic-bezier(.22,.61,.36,1) .5s}
html.rv-ready .process-grid.is-drawn .step-card:nth-child(2) .step-number::after{transition-delay:.85s}
html.rv-ready .process-grid.is-drawn .step-card:nth-child(3) .step-number::after{transition-delay:1.2s}
/* Thin reading-progress bar along the top edge */
.scroll-progress{position:fixed;top:0;left:0;right:0;height:3px;z-index:1100;pointer-events:none;transform-origin:left center;transform:scaleX(0);background:linear-gradient(90deg,var(--accent),var(--primary))}
/* ── END SCROLL REVEAL ────────────────────────────────────── */

  function bindUi() {
    const toggle = document.querySelector(".nav-toggle");
    const nav = document.querySelector(".site-nav");
    if (toggle && nav) {
      toggle.addEventListener("click", () => {
        nav.classList.toggle("is-open");
        toggle.setAttribute("aria-expanded", nav.classList.contains("is-open"));
      });
    }
    const contactForm = document.getElementById("contactForm");
    if (contactForm) {
      contactForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        contactForm.classList.remove("is-submitted", "is-error");
        const endpoint = contactForm.dataset.endpoint || "";
        const submitBtn = contactForm.querySelector(".cfm-submit");
        const submitLabel = contactForm.querySelector(".cfm-submit-label");
        const originalLabel = submitLabel ? submitLabel.textContent : "";
        if (submitBtn) submitBtn.disabled = true;
        if (submitLabel) submitLabel.textContent = "Sending…";
        try {
          if (!endpoint || endpoint.includes("YOUR_FORM_ID")) {
            throw new Error("Form endpoint not configured yet");
          }
          const response = await fetch(endpoint, {
            method: "POST",
            headers: { Accept: "application/json" },
            body: new FormData(contactForm)
          });
          if (!response.ok) throw new Error("Delivery failed");
          contactForm.classList.add("is-submitted");
          contactForm.reset();
        } catch (err) {
          contactForm.classList.add("is-error");
        } finally {
          if (submitBtn) submitBtn.disabled = false;
          if (submitLabel) submitLabel.textContent = originalLabel;
        }
      });
    }

    // Active nav link is now set at render time in header() based on the current page

    // Photo gallery lightbox
    const lightbox = document.getElementById("lightbox");
    if (lightbox) {
      const lightboxImg = document.getElementById("lightboxImg");
      const lightboxCaption = document.getElementById("lightboxCaption");
      const closeLightbox = () => { lightbox.classList.remove("is-open"); lightboxImg.src = ""; };
      document.querySelectorAll(".gallery-item img").forEach(img => {
        img.style.cursor = "pointer";
        img.addEventListener("click", () => {
          lightboxImg.src = img.src;
          lightboxImg.alt = img.alt;
          if (lightboxCaption) lightboxCaption.textContent = img.alt;
          lightbox.classList.add("is-open");
        });
      });
      const lightboxCloseBtn = document.getElementById("lightboxClose");
      if (lightboxCloseBtn) lightboxCloseBtn.addEventListener("click", closeLightbox);
      lightbox.addEventListener("click", (e) => { if (e.target === lightbox) closeLightbox(); });
      document.addEventListener("keydown", (e) => { if (e.key === "Escape") closeLightbox(); });
    }

    // Gallery filter pills
    const galleryFilterBtns = document.querySelectorAll(".gallery-filter-btn");
    const galleryItems = document.querySelectorAll(".gallery-item[data-category]");
    if (galleryFilterBtns.length && galleryItems.length) {
      galleryFilterBtns.forEach(btn => {
        btn.addEventListener("click", () => {
          galleryFilterBtns.forEach(b => b.classList.remove("is-active"));
          btn.classList.add("is-active");
          const filter = btn.dataset.filter;
          galleryItems.forEach(item => {
            const show = filter === "All Photos" || item.dataset.category === filter;
            item.style.display = show ? "" : "none";
          });
        });
      });
    }

    // FAQ row accordion
    document.querySelectorAll("[data-faq]").forEach(row => {
      const btn = row.querySelector(".faq-row__trigger");
      if (!btn) return;
      btn.addEventListener("click", () => {
        const isOpen = row.classList.contains("faq-row--open");
        document.querySelectorAll("[data-faq]").forEach(r => {
          r.classList.remove("faq-row--open");
          const b = r.querySelector(".faq-row__trigger");
          if (b) b.setAttribute("aria-expanded", "false");
        });
        if (!isOpen) {
          row.classList.add("faq-row--open");
          btn.setAttribute("aria-expanded", "true");
        }
      });
    });

    // 3-Step Booking Wizard
    const panes   = [null,
      document.getElementById("wizPane1"),
      document.getElementById("wizPane2"),
      document.getElementById("wizPane3"),
      document.getElementById("wizPane4")];
    const steps   = document.querySelectorAll(".wiz-step");
    const fill    = document.getElementById("wizFill");
    const summary = document.getElementById("wizSummary");

    if (!panes[1]) return; // not on booking page

    function showPane(n) {
      panes.forEach((p, i) => { if (i > 0) p.classList.toggle("wiz-pane--hidden", i !== n); });
      // update inline stepper dots
      document.querySelectorAll(".wiz-stepper-inline__step").forEach((s, i) => {
        const stepNum = i + 1;
        s.classList.toggle("wiz-stepper-inline__step--active", stepNum === n);
        s.classList.toggle("wiz-stepper-inline__step--done", stepNum < n);
      });
      // update connector lines
      const line1 = document.getElementById("wizLine1");
      const line2 = document.getElementById("wizLine2");
      if (line1) line1.classList.toggle("wiz-stepper-inline__line--done", n > 1);
      if (line2) line2.classList.toggle("wiz-stepper-inline__line--done", n > 2);
      const wizShell = document.querySelector(".wiz-shell");
      if (wizShell) {
        const offset = wizShell.getBoundingClientRect().top + window.scrollY - 90;
        window.scrollTo({ top: offset, behavior: "smooth" });
      }
    }

    function buildSummary() {
      if (!summary) return;
      const svc  = document.querySelector('input[name="service"]:checked');
      const date = { value: document.getElementById("bookDate") ? document.getElementById("bookDate").value : "—" };
      const time = document.querySelector('input[name="time"]:checked');
      const rows = [
        { label:"Service", val: svc  ? svc.value  : "—" },
        { label:"Date",    val: date ? date.value  : "—" },
        { label:"Time",    val: time ? time.value  : "—" }
      ].map(r => `<div class="wiz-summary-row"><strong>${r.label}</strong><span>${r.val}</span></div>`).join("");
      summary.innerHTML = rows;
      summary.classList.add("is-visible");
    }

    // Generate date buttons as a horizontal slider
    (function() {
      const row = document.getElementById("dateBtnRow");
      const slotGrid = document.getElementById("slotGrid");
      const prevBtn = document.getElementById("dateSliderPrev");
      const nextBtn = document.getElementById("dateSliderNext");
      if (!row || !slotGrid) return;

      const DAYS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
      const MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

      // Build 14 bookable dates for scroll room. The clinic is open Monday to Saturday, so Sundays are skipped.
      const dates = [];
      for (let i = 0; dates.length < 14 && i < 30; i++) {
        const d = new Date();
        d.setDate(d.getDate() + i);
        if (d.getDay() === 0) continue;
        dates.push(d);
      }
      const startOfDay = (x) => new Date(x.getFullYear(), x.getMonth(), x.getDate());

      function pad(n){ return String(n).padStart(2,'0'); }
      function formatValue(d){ return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; }

      // Slider offset state
      let sliderIndex = 0;
      const BTN_WIDTH = 72; // 64px btn + 8px gap

      function getVisibleCount() {
        const track = document.querySelector(".date-slider-track");
        if (!track) return 4;
        return Math.floor(track.clientWidth / BTN_WIDTH);
      }

      function updateSlider() {
        const visible = getVisibleCount();
        const maxIndex = Math.max(0, dates.length - visible);
        sliderIndex = Math.min(sliderIndex, maxIndex);
        row.style.transform = `translateX(-${sliderIndex * BTN_WIDTH}px)`;
        if (prevBtn) prevBtn.style.opacity = sliderIndex === 0 ? "0.35" : "1";
        if (nextBtn) nextBtn.style.opacity = sliderIndex >= maxIndex ? "0.35" : "1";
        if (prevBtn) prevBtn.style.pointerEvents = sliderIndex === 0 ? "none" : "auto";
        if (nextBtn) nextBtn.style.pointerEvents = sliderIndex >= maxIndex ? "none" : "auto";
      }

      if (prevBtn) prevBtn.addEventListener("click", () => { sliderIndex = Math.max(0, sliderIndex - 1); updateSlider(); });
      if (nextBtn) nextBtn.addEventListener("click", () => {
        const visible = getVisibleCount();
        sliderIndex = Math.min(dates.length - visible, sliderIndex + 1);
        updateSlider();
      });

      // Generate 30-min slots for clinic hours (4 PM to 9 PM): 4:00 PM through 8:30 PM
      const slots = [];
      for (let h = 16; h < 21; h++) {
        slots.push(`${h - 12}:00 PM`);
        slots.push(`${h - 12}:30 PM`);
      }

      function renderSlots() {
        slotGrid.innerHTML = slots.map(t => `
          <label class="time-pill">
            <input type="radio" name="time" value="${t}" />
            <span>${t}</span>
          </label>`).join("");
      }

      dates.forEach((d, i) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "date-btn" + (i === 0 ? " is-active" : "");
        const dayDiff = Math.round((startOfDay(d) - startOfDay(new Date())) / 86400000);

        const label = dayDiff === 0 ? "Today" : dayDiff === 1 ? "Tomorrow" : DAYS[d.getDay()];

        btn.addEventListener("click", () => {
          row.querySelectorAll(".date-btn").forEach(b => b.classList.remove("is-active"));
          btn.classList.add("is-active");
          document.getElementById("bookDate").value = formatValue(d);
        });
        row.appendChild(btn);
        if (i === 0) document.getElementById("bookDate").value = formatValue(d);
      });

      renderSlots();
      updateSlider();

  if (page === "home" && window.location.hash) {
    const target = document.getElementById(window.location.hash.slice(1));
    if (target) {
      const offset = target.getBoundingClientRect().top + window.scrollY - 90;

  }

  // Nav highlight follows the section currently in view (home page only).
  // Sections with no nav link (core values belongs to Home; process, reviews and the
  // booking CTA map to null) leave the nav with no active item rather than the wrong one.
  if (page === "home") {
    const navLinks = Array.from(document.querySelectorAll(".site-nav a"));
    const spy = [
      ["#home", "?"], [".values-section", "?"], ["#services", "?#services"],
      ["#process", null], ["#reviews", null], ["#faq", "?#faq"], [".book-cta", null]
    ].map(([sel, href]) => ({ el: document.querySelector(sel), href })).filter((s) => s.el);
    let spyQueued = false;
    const updateActiveNav = () => {
      spyQueued = false;
      const vh = window.innerHeight;
      let best = null, bestVisible = 0;
      spy.forEach((s) => {
        const r = s.el.getBoundingClientRect();
        const visible = Math.min(r.bottom, vh) - Math.max(r.top, 80);
        if (visible > bestVisible) { bestVisible = visible; best = s; }
      });
      const activeHref = best ? best.href : null;
      navLinks.forEach((a) => a.classList.toggle("is-active", a.getAttribute("href") === activeHref));

    const groups = [
      [".values-heading > *", "up", 0], [".value-card", "scale", 120],
      [".services-intro > *", "up", 0], [".services-list li", "up", 120], [".services-cta", "up", 300],

      [".book-cta-inner > *", "up", 0],
      [".dr-approach-text > *", "up", 0], [".dr-approach-media", "scale", 150], [".dr-approach-values", "up", 150],
      [".gallery-hero > *", "up", 0], [".gallery-filters", "up", 120], [".gallery-item", "scale", 0], [".gallery-trust-item", "up", 0],
      [".contact-head > *", "up", 0], [".contact-info-card", "up", 100], [".contact-form-modern", "up", 220], [".contact-map-full", "fade", 100]
    ];
    const CLEAN = ["rv", "rv-in", "rv-up", "rv-scale", "rv-fade"];

    const io = new IntersectionObserver((entries) => {
      entries.forEach((entry) => {
        if (!entry.isIntersecting) return;
        const el = entry.target;
        io.unobserve(el);
        if (el.classList.contains("process-grid")) { el.classList.add("is-drawn"); return; }
        el.classList.add("rv-in");
        const wait = 900 + (parseInt(el.style.transitionDelay, 10) || 0);
        setTimeout(() => { el.classList.remove(...CLEAN); el.style.transitionDelay = ""; }, wait);
      });
    }, { threshold: 0.1, rootMargin: "0px 0px -5% 0px" });

    groups.forEach(([sel, kind, base]) => {
      const seen = new Map();
      document.querySelectorAll(sel).forEach((el) => {
        const i = seen.get(el.parentElement) || 0;
        seen.set(el.parentElement, i + 1);
        el.classList.add("rv", "rv-" + kind);
        el.style.transitionDelay = (base + Math.min(i, 6) * 80) + "ms";
        io.observe(el);
      });
    });
    const grid = document.querySelector(".process-grid");
    if (grid) io.observe(grid);
    document.documentElement.classList.add("rv-ready");

    // Reading-progress bar
    const bar = document.createElement("div");
    bar.className = "scroll-progress";
    bar.setAttribute("aria-hidden", "true");
    document.body.appendChild(bar);
    let barQueued = false;
    const paintBar = () => {
      barQueued = false;
      const max = document.documentElement.scrollHeight - window.innerHeight;
      bar.style.transform = "scaleX(" + (max > 0 ? Math.min(1, window.scrollY / max) : 0) + ")";
    };
    window.addEventListener("scroll", () => { if (!barQueued) { barQueued = true; requestAnimationFrame(paintBar); } }, { passive: true });
    window.addEventListener("resize", paintBar);
    paintBar();
  })();

      const data = window.clinicTemplate;

      function getAnswer(msg) {
        const m = msg.toLowerCase().replace(/[^a-z0-9\s\-]/g,"");
        const words = m.split(/\s+/);
        let best = null, bestScore = 0;
        for (const entry of KB) {
          let score = 0;
          for (const key of entry.keys) {
            if (m.includes(key)) score += key.length > 4 ? 3 : 1;
          }
          if (score > bestScore) { bestScore = score; best = entry; }
        }
        return bestScore > 0 ? best.answer : FALLBACK;

      const closeIcon= fab.querySelector(".chat-fab-icon--close");

      let isOpen = false;
      let greeted = false;

      /* ── HELPERS ───────────────────────────────────────────── */
      function botIconSvg(){
        return `<div class="chat-bot-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/></svg></div>`;
      }

      function addBotMsg(html){
        const div = document.createElement("div");
        div.className = "chat-msg chat-msg--bot";
        div.innerHTML = `${botIconSvg()}<div class="chat-bubble">${html}</div>`;
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
      }

      function addUserMsg(text){
        const div = document.createElement("div");
        div.className = "chat-msg chat-msg--user";
        div.innerHTML = `<div class="chat-bubble">${escHtml(text)}</div>`;
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
      }

      function escHtml(s){ return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

      function showTyping(){
        const div = document.createElement("div");
        div.className = "chat-msg chat-msg--bot chat-typing";
        div.id = "chatTyping";
        div.innerHTML = `${botIconSvg()}<div class="chat-bubble"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>`;
        msgs.appendChild(div);
        msgs.scrollTop = msgs.scrollHeight;
        return div;
      }

      function removeTyping(){ const t = document.getElementById("chatTyping"); if(t) t.remove(); }

      function reply(userText){
        addUserMsg(userText);
        const typing = showTyping();
        setTimeout(()=>{
          removeTyping();
          addBotMsg(getAnswer(userText));
        }, 650 + Math.random()*300);
      }

      /* ── OPEN / CLOSE ──────────────────────────────────────── */
      function openChat(){
        isOpen = true;
        fab.classList.add("is-open","is-seen");
        fab.setAttribute("aria-label","Close Patient Assistant");
        widget.classList.add("is-open");
        widget.setAttribute("aria-hidden","false");
        openIcon.style.display = "none";
        closeIcon.style.display = "flex";
        if(!greeted){
          greeted = true;
          setTimeout(()=>{
            addBotMsg(data.chatbot.greeting);
          }, 180);
        }
        setTimeout(()=>input.focus(), 250);
      }

      function closeChat(){
        isOpen = false;
        fab.classList.remove("is-open");
        fab.setAttribute("aria-label","Open Patient Assistant");
        widget.classList.remove("is-open");
        widget.setAttribute("aria-hidden","true");
        openIcon.style.display = "flex";
        closeIcon.style.display = "none";
      }

      fab.addEventListener("click", ()=> isOpen ? closeChat() : openChat());
      fab.addEventListener("keydown", e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); isOpen ? closeChat() : openChat(); }});
      closeBtn.addEventListener("click", closeChat);

      /* ── SEND ──────────────────────────────────────────────── */
      function send(){
        const text = input.value.trim();
        if(!text) return;
        input.value = "";
        if(!greeted){ greeted = true; }
        reply(text);
      }

      sendBtn.addEventListener("click", send);
      input.addEventListener("keydown", e=>{ if(e.key==="Enter") send(); });

      /* ── CHIPS ─────────────────────────────────────────────── */
      chips.forEach(chip => {
        chip.addEventListener("click", ()=>{
          const q = chip.dataset.q;
          if(!isOpen) openChat();
          setTimeout(()=> reply(q), greeted ? 0 : 250);
        });
      });

      /* Show the "Ask Dr. AI" label briefly the first time the button appears */
      let introShown = false;
      function introLabel(){
        if(introShown) return;
        introShown = true;
        fab.classList.add("is-expanded");
        setTimeout(()=> fab.classList.remove("is-expanded"), 6000);
      }

      /* ── FAB VISIBILITY: appear only after the hero is scrolled past ── */
      const heroEl = document.querySelector(".hero-v2") || document.querySelector(".hero");
      if (heroEl && "IntersectionObserver" in window) {
        const heroObserver = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            fab.classList.toggle("is-visible", !entry.isIntersecting);
            if(!entry.isIntersecting) introLabel();
          });
        }, { threshold: 0.05 });
        heroObserver.observe(heroEl);
      } else {
        // Fallback: reveal after a short delay if hero can't be found
        setTimeout(()=>{ fab.classList.add("is-visible"); introLabel(); }, 800);
      }

    })();
    </script>
    <!-- ── END AI PATIENT ASSISTANT ─────────────────────────── -->

  </body>
</html>
